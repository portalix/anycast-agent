name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  # The compatibility claim, executed: all five dnstap dialects against
  # real servers, including reconnect. ~5 minutes.
  zoo-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: zoo/e2e.sh
