# NSD in the zoo — dnstap straight to the agent socket.
server:
    identity: "nsd-zoo"
    zonesdir: "/zones"
    do-ip4: yes
    do-ip6: no
    verbosity: 1
    username: ""

dnstap:
    dnstap-enable: yes
    dnstap-socket-path: "/dnstap/nsd.sock"
    dnstap-send-identity: yes
    dnstap-identity: "nsd-zoo"
    dnstap-send-version: yes
    dnstap-log-auth-query-messages: yes
    dnstap-log-auth-response-messages: yes

zone:
    name: "zoo.test"
    zonefile: "zoo.test.zone"
