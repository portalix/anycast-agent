-- dnsdist in the zoo — same structure as a production front, just without
-- an anycast IP or QPS limits.
setLocal("0.0.0.0:53")
newServer({address="127.0.0.1:5300", name="pdns-auth"})
fsul = newFrameStreamUnixLogger("/dnstap/dnsdist.sock")
addAction(AllRule(), DnstapLogAction("pdns-zoo", fsul))
addResponseAction(AllRule(), DnstapLogResponseAction("pdns-zoo", fsul))
setACL({"0.0.0.0/0", "::/0"})
