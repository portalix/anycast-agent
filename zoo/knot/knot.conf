# Knot in the zoo — dnstap via mod-dnstap to the agent socket.
server:
    rundir: /rundir
    user: knot
    listen: 0.0.0.0@53
    identity: knot-zoo

log:
  - target: stdout
    any: info

mod-dnstap:
  - id: capture
    sink: unix:/dnstap/knot.sock
    identity: knot-zoo
    log-queries: on
    log-responses: on

template:
  - id: default
    storage: /var/lib/knot
    global-module: mod-dnstap/capture

zone:
  - domain: zoo.test
    file: /zones/zoo.test.zone
