# Unbound in the zoo — dnstap to the agent socket.
#
# Unbound is a resolver, not authoritative: it serves the zoo zone via
# auth-zone/for-downstream and therefore logs CLIENT_QUERY/CLIENT_RESPONSE
# instead of AUTH_*. It is the fifth independent Frame Streams
# implementation in the zoo (its own dnstap-io thread with its own
# reconnect timer) — which is exactly why it is here.
server:
    interface: 0.0.0.0
    port: 53
    access-control: 0.0.0.0/0 allow
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Inside the container: no privilege drop and no chroot, or Unbound
    # can reach neither /zones nor the agent socket.
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    logfile: ""
    verbosity: 1

    identity: "unbound-zoo"
    hide-identity: no

    # Disable the RFC 6761 reflex: Unbound otherwise answers `test.` from
    # a built-in local-zone with NXDOMAIN and the auth-zone never gets a
    # chance.
    local-zone: "test." nodefault

    # No trust anchors: the zoo has no internet upstream, nothing gets
    # validated. Anything outside zoo.test may fall into the void.

auth-zone:
    name: "zoo.test"
    zonefile: "/zones/zoo.test.zone"
    for-downstream: yes
    for-upstream: no
    fallback-enabled: no

dnstap:
    dnstap-enable: yes
    dnstap-bidirectional: yes
    dnstap-socket-path: "/dnstap/unbound.sock"
    dnstap-send-identity: yes
    dnstap-identity: "unbound-zoo"
    dnstap-send-version: yes
    dnstap-log-client-query-messages: yes
    dnstap-log-client-response-messages: yes
