// BIND in the zoo — dnstap to the agent socket.
options {
    directory "/var/cache/bind";
    recursion no;
    listen-on { any; };
    listen-on-v6 { any; };
    allow-query { any; };
    dnstap { all; };
    dnstap-output unix "/dnstap/bind.sock";
    dnstap-identity "bind-zoo";
    server-id "bind-zoo";
};

zone "zoo.test" {
    type primary;
    file "/zones/zoo.test.zone";
};
